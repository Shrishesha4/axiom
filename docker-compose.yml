services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axiom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axiom}
      POSTGRES_DB: ${POSTGRES_DB:-axiom_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axiom}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-axiom}:${POSTGRES_PASSWORD:-axiom}@db:5432/${POSTGRES_DB:-axiom_db}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash}
      OPENROUTER_WEB_SEARCH_ENABLED: ${OPENROUTER_WEB_SEARCH_ENABLED:-false}
      OPENROUTER_WEB_SEARCH_MAX_RESULTS: ${OPENROUTER_WEB_SEARCH_MAX_RESULTS:-5}
      OPENROUTER_WEB_SEARCH_ENGINE: ${OPENROUTER_WEB_SEARCH_ENGINE:-}
      OPENROUTER_WEB_SEARCH_MODE: ${OPENROUTER_WEB_SEARCH_MODE:-}
      OPENROUTER_WEB_SEARCH_CONTEXT_SIZE: ${OPENROUTER_WEB_SEARCH_CONTEXT_SIZE:-}
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@axiom.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DEFAULT_USER_TOKEN_LIMIT: ${DEFAULT_USER_TOKEN_LIMIT:-100000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  postgres_data:
